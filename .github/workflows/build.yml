name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and build package
        env:
          SENTRY_KEY: ${{ secrets.SENTRY_KEY }}
          SEGMENTS_KEY: ${{ secrets.SEGMENTS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --break-system-packages -r requirements.txt
          python -m pip install --break-system-packages paver
          paver setup

          paver package.sentry="${SENTRY_KEY}" package.segments="${SEGMENTS_KEY}" package.version="${GITHUB_SHA::7}" package
          ls -lah planet_explorer.zip

      - name: Upload package artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: planet_explorer_${{ github.sha }}
          path: planet_explorer.zip

  install:
    name: Install
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        qgis_version: ["4.0.3"]
    env:
      QGIS_TEST_VERSION: ${{ matrix.qgis_version }}
      QGIS_COMMAND: qgis --noversioncheck --nologo --version-migration --code ./planet_explorer/tests/install_plugin.py

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download artifact
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: planet_explorer_${{ github.sha }}
          path: .

      - name: Build package locally for act
        if: ${{ env.ACT }}
        env:
          SENTRY_KEY: ${{ secrets.SENTRY_KEY }}
          SEGMENTS_KEY: ${{ secrets.SEGMENTS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --break-system-packages -r requirements.txt
          python -m pip install --break-system-packages paver
          paver setup

          paver package.sentry="${SENTRY_KEY}" package.segments="${SEGMENTS_KEY}" package.version="${GITHUB_SHA::7}" package
          ls -lah planet_explorer.zip

      - name: Pull qgis image
        run: docker pull "qgis/qgis:${QGIS_TEST_VERSION}-questing"

      - name: Run install test
        timeout-minutes: 2
        run: |
          docker run --rm \
            -e QT_QPA_PLATFORM=offscreen \
            -v "$(pwd)":/tests_directory \
            -w /tests_directory \
            "qgis/qgis:${QGIS_TEST_VERSION}-questing" \
            sh -lc 'LANG=C.utf8 LC_ALL=C.utf8 DISPLAY=:0 qgis --noversioncheck --nologo --version-migration --code planet_explorer/tests/install_plugin.py'
