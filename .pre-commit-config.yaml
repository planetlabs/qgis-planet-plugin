# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: "➡️ Fix End of Files"
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^(planet_explorer/tests/data/)
      - id: trailing-whitespace
        name: "🧹 Trim Trailing Whitespace"
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^(planet_explorer/tests/data/)
      - id: check-yaml
        name: "🔍 Check YAML Syntax"
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-json
        name: "🔍 Check JSON Syntax"
        entry: check-json
        language: system
        types: [json]
        exclude: ^(planet_explorer/planet_api/request-result-samples/)

  - repo: local
    hooks:
      - id: black
        name: "🖤 black"
        entry: black
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: remove-core-file
        name: "🗑️ Remove core file if it exists"
        entry: bash -c '[[ -f core && ! -d core ]] && rm core || exit 0'
        language: system
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ensure-utf8-encoding
        name: "🌐 Ensure UTF-8 encoding declaration in Python files"
        entry: bash scripts/encoding_check.sh
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ensure-google-docstrings
        name: "📚 Ensure Google-style docstrings in Python modules"
        entry: bash scripts/docstrings_check.sh
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: flake8
        name: " flake8 Python Linter"
        entry: flake8
        args: ['--extend-ignore=E203,W503', '--ignore=DAR']
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: isort
        name: "📦 isort - sort Python imports"
        entry: isort --check --diff
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: https://github.com/NixOS/nixfmt
    rev: v1.3.1
    hooks:
      - id: nixfmt
        name: "❄️ Nixfmt (RFC style)"
        description: Format Nix code with nixfmt-rfc-style
        entry: nixfmt
        language: system
        args: ["--"]
        types: [nix]

  - repo: local
    hooks:
      - id: markdownlint
        name: "📝 markdownlint - Markdown linter"
        entry: markdownlint
        language: system
        types: [markdown]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: cspell
        name: "🔤 cspell - Spell checker for Markdown"
        entry: cspell --config=.cspell.json --no-progress --no-summary
        language: system
        types: [markdown]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: yamllint
        name: "🔍 yamllint - YAML linter"
        entry: yamllint
        language: system
        types: [yaml]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: actionlint
        name: "🤖 actionlint - GitHub Actions workflow linter"
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck-scripts
        name: "🐚 ShellCheck - scripts"
        entry: shellcheck
        language: system
        files: ^scripts/.*\.(sh|bash|zsh)$
        pass_filenames: true

  - repo: local
    hooks:
      - id: bearer-plugin
        name: "🛡️ Bearer - Security & privacy scanner - planet_explorer"
        entry: bearer scan --exit-code 1 planet_explorer
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: bandit
        name: "🔒 Bandit - Python security analysis"
        entry: bandit -r scripts planet_explorer -c bandit.yaml
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: detect-secrets
        name: "🔒 Detect Secrets"
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        stages: [pre-commit]


