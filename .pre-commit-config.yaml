# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  # out-of-the-box hooks for pre-commit
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: "➡️ Fix End of Files"
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^(planet_explorer/tests/data/)

      - id: trailing-whitespace
        name: "🧹 Trim Trailing Whitespace"
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^(planet_explorer/tests/data/)

      - id: check-yaml
        name: "🔍 Check YAML Syntax"
        entry: check-yaml
        language: system
        types: [yaml]

  # Other hooks
  - repo: local
    hooks:
      - id: biome-json
        name: "🧾 Format and Lint JSON & JSONC files (biome)"
        entry: biome
        args: ["check", "--config-path", "biome.json", "--write", "--unsafe", "--log-level", "warn"]
        language: system
        files: \.(json|jsonc)$

      - id: yamllint
        name: "🔍 yamllint - YAML linter"
        entry: yamllint
        args: ["-c", ".config/.yamllint"]
        language: system
        types: [yaml]
        stages: [pre-commit]

      - id: remove-core-file
        name: "🗑️ Remove core file if it exists"
        entry: fd -H -t f -d 1 -I '^core(\.[0-9]+)?$' -X rm -f
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: markdownlint
        name: "📝 markdownlint - Markdown linter"
        entry: markdownlint
        args: ["--config", ".config/.markdownlint.yaml", "--fix"]
        language: system
        types: [markdown]
        stages: [pre-commit]

      - id: cspell
        name: "🔤 cspell - Spell checker for Markdown"
        entry: cspell
        args: ["--config=.config/.cspell.json", "--no-progress", "--no-summary"]
        language: system
        types: [markdown]
        stages: [pre-commit]

      - id: nixfmt
        name: "❄️ Nixfmt (RFC style)"
        description: Format Nix code with nixfmt-rfc-style
        entry: nixfmt
        language: system
        args: ["--"]
        types: [nix]

      - id: shfmt-scripts
        name: "🐚 Format shell scripts"
        entry: shfmt
        args: ["-w"]
        language: system
        files: ^scripts/.*\.(sh|bash)$
        pass_filenames: true

      - id: shellcheck-scripts
        name: "🐚 ShellCheck - scripts"
        entry: shellcheck
        language: system
        files: ^scripts/.*\.(sh|bash)$
        pass_filenames: true

      - id: actionlint
        name: "🤖 actionlint - GitHub Actions workflow linter"
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]

      - id: taplo-fmt
        name: "🧵 Format and lint TOML files using taplo"
        entry: env RUST_LOG=warn taplo fmt
        args: ["--config", ".config/.taplo.toml"]
        language: system
        types: [toml]

      - id: mbake-format
        name: "🧰 Format Makefiles"
        entry: mbake format
        args: ["--config", ".config/.bake.toml"]
        language: system
        types: [makefile]

      - id: mbake-validate
        name: "🔍 Validate Makefiles"
        entry: mbake validate
        args: ["--config", ".config/.bake.toml"]
        language: system
        types: [makefile]

  # Python code hooks
  - repo: local
    hooks:
      - id: ruff-formatter
        name: " Ruff Formatter"
        entry: ruff format
        args: ["--config", ".config/ruff.toml", "--exit-non-zero-on-format", "--color", "always"]
        language: system
        types: [python]

      - id: flake8
        name: " flake8 Python Linter"
        entry: bash scripts/flake8_check.sh
        language: system
        pass_filenames: false

      - id: ensure-google-docstrings
        name: "📚 Ensure Google-style docstrings in Python modules"
        entry: bash scripts/docstrings_check.sh
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

  ## QGIS Plugin Security checks
  - repo: local
    hooks:
      - id: bearer-plugin
        name: "🛡️ Bearer - Security & privacy scanner - planet_explorer"
        entry: bearer scan --ignore-file=.config/bearer.ignore --exit-code 1 planet_explorer
        language: system
        pass_filenames: false

      - id: bandit
        name: "🔒 Bandit - Python security analysis"
        entry: bash scripts/bandit_check.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: detect-secrets
        name: "🔒 Detect Secrets"
        entry: bash scripts/detect_secrets.sh
        pass_filenames: false
        language: system

      - id: filecheck
        name: "📂 File Check - File analysis"
        entry: bash scripts/file_analysis.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

